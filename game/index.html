<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창문 달</title>
<style>
  body{background:#0d1420;color:#e8e4d8;font-family:"Noto Serif KR",serif;max-width:38em;margin:40px auto;padding:0 20px;line-height:1.9}
  h1{color:#d8b45a;letter-spacing:.2em;font-size:1.4rem;margin-bottom:.4em}
  #turn{color:#9a9788;font-size:.85em;letter-spacing:.15em;margin-bottom:.6em}
  #panel{color:#9a9788;font-size:.85em;border:1px solid #2b3a4d;padding:8px 12px;margin-bottom:1.4em}
  #panel b{color:#d8b45a;font-weight:normal}
  .choice{display:block;margin:10px 0;padding:10px 16px;border:1px solid #2b3a4d;color:#d8b45a;cursor:pointer;background:none;width:100%;text-align:left;font:inherit}
  .choice:hover{background:rgba(216,180,90,.1)}
  .inspect{display:block;margin:8px 0;padding:8px 16px;border:1px dashed #2b3a4d;color:#9a9788;cursor:pointer;background:none;width:100%;text-align:left;font:inherit;font-size:.95em}
  .inspect:hover{background:rgba(154,151,136,.08);color:#e8e4d8}
  #itch-slot{margin-top:24px}
  #itch-slot a{color:#d8b45a}
</style>
</head>
<body>
<h1 id="title"></h1>
<div id="turn"></div>
<div id="panel"></div>
<div id="text"></div>
<div id="choices"></div>
<div id="itch-slot"></div>

<script>
/* ═══ 1. 게임 데이터 — 고치는 곳은 여기뿐 ═══ */
const GAME = {
  title: "창문 달",

  /* itch.io 주소. 비어 있으면 엔딩 화면에 아무것도 나타나지 않는다. */
  itchUrl: "https://knuaguy.itch.io/ggogggogsumera",
  itchLabel: "꼭꼭 숨어라를 플레이하기",

  start: "프롤로그",
  totalTurns: 10,

  /* 표시 상태(rel·brew·money·resp)는 0~5.
     나머지는 화면에 보이지 않는 숨은 기록.
     - 행동: ledger confess patch cosign labelonly solo table stay
     - 살펴본 것(trace): t_edge t_smell t_hand t_vat t_memo t_desk t_notice t_drain
     - 가져간 흔적(carry): c_label c_msg c_place c_paper c_page c_sound
                           c_notice c_bottle c_photo c_walk c_text8 c_piece */
  initialState: {
    rel: 3, brew: 3, money: 0, resp: 0,
    ledger: 0, confess: 0, patch: 0, cosign: 0,
    labelonly: 0, solo: 0, table: 0, stay: 0,
    t_edge: 0, t_smell: 0, t_hand: 0, t_vat: 0,
    t_memo: 0, t_desk: 0, t_notice: 0, t_drain: 0,
    c_label: 0, c_msg: 0, c_place: 0, c_paper: 0, c_page: 0, c_sound: 0,
    c_notice: 0, c_bottle: 0, c_photo: 0, c_walk: 0, c_text8: 0, c_piece: 0
  },

  panel: [
    { key: "rel",   name: "관계",   labels: ["잃음","끊어질 듯","서먹함","곁에 있음","단단함","한 배"] },
    { key: "brew",  name: "양조장", labels: ["사라짐","문 닫기 직전","위태로움","작게 익는 중","자리 잡음","넉넉히 익는 중"] },
    { key: "money", name: "돈",     labels: ["빈손","빠듯함","숨통","여유","넉넉함","거부"] },
    { key: "resp",  name: "책임",   labels: ["가벼움","마음의 빚","나눠 진 무게","무거움","짓눌림","혼자 진 빚"] }
  ],

  /* 노드 형태
     - 과거 장면: { turn, text|variants, extras, inspects:[{label,trace,text|variants}], choices }
       · inspects: 같은 턴 안에서 짧은 장면을 열고 돌아온다. 턴을 소비하지 않고 잠금도 아니다.
       · extras: 조건이 맞으면 본문 뒤에 덧붙는 문단(가져간 흔적의 영향).
     - 바뀐 현재: { turn, variants, extras, carries:[{label,key,text|variants}], next:{label,to} }
       · 흔적 카드 중 하나를 골라 짧은 장면을 읽은 뒤에만 다음 알약으로 간다.
     - 기억 지도: { turn, map:true, text, places:[{label, to?|text|variants}] }
       · 실패·재시도·초기화 없음. 성찰을 읽고 돌아올 수 있다.
     - effects: 숫자는 증감, "=n"은 고정. variants는 when({키:[최소,최대]}) 순서 검사. */
  nodes: {

    "프롤로그": {
      text: "마흔다섯. 직업은 없고, 삶은 무겁다.\n\n어느 날, 우연히 알약 다섯 개를 발견한다.\n한 알을 삼키면 과거의 한 시점으로 돌아갈 수 있다는 것을,\n당신은 곧 알게 된다.\n\n손바닥 위의 다섯 알. 머릿속에 제일 먼저 떠오른 것은 거창한 후회가 아니었다.\n\n— 주식을 사야 한다.",
      choices: [
        { label: "첫 번째 알약을 삼킨다", to: "1_개입" }
      ]
    },

    "1_개입": {
      turn: 1,
      text: "2008년, 금융위기 직후. 스물일곱의 당신이 공장지대 한켠, 친구의 작은 양조장 사무실에 앉아 있다.\n\n문가에는 쌀 포대가 어깨에 얹는 순서대로 세 자루 기대어 있다. 친구는 머리에 두른 수건으로 이마를 훔치며, 갓 인쇄된 생산표를 책상에 편다. 잉크 냄새 위로 누룩 냄새가 얹힌다. 당신이 그린 창문 달 라벨 시안이 그 옆에 핀으로 꽂혀 있다.\n\n무직인 당신에게 친구는 보증까지 서 주었다. 그리고 오늘, 친구가 손을 내민다.\n\n\"우리 같이 양조장 하자.\"\n\n통장에는 친구의 보증으로 마련한 돈이 있고, 당신은 미래를 안다.",
      inspects: [
        { label: "생산표와 보증서의 가장자리를 살펴본다", trace: "t_edge",
          text: "생산표 아래에 보증서 사본이 깔려 있다.\n\n가장자리가 여러 번 접혔다 펴진 자국. 친구는 이 종이를 몇 번이나 꺼내 읽었을까. 서명란에는 친구의 이름이 눌러쓴 획으로 남아 있다 — 한 번에 쓰지 못하고, 두 번 덧그은 획.\n\n보증이라는 말의 무게를, 종이가 먼저 알고 있었다." },
        { label: "창가의 누룩 냄새를 들이마신다", trace: "t_smell",
          text: "작은 사각 창으로 공장지대의 회색 벽이 보인다.\n\n창턱에는 증기가 눌어붙은 자국, 그 아래 발효통에서 미지근한 김이 오른다. 누룩 냄새는 달큰하고 조금 시큼하다.\n\n밤이 되면 이 창에 달이 걸린다는 것을 당신은 안다. 그 달을 라벨로 그린 것도 당신이다." }
      ],
      choices: [
        { label: "통장에 남은 돈을 시장으로 옮긴다", to: "1_현재",
          effects: { money: "=5", rel: -1, resp: +1 } },
        { label: "친구와 첫 달의 생산표를 맞춘다", to: "1_현재",
          effects: { ledger: +1, rel: +2, brew: +1, money: +1 } },
        { label: "보증을 정리하고 각자 버틴다", to: "1_현재",
          effects: { rel: -1, brew: -1 } }
      ]
    },

    "1_현재": {
      turn: 2,
      variants: [
        { when: { money: [3, 5] },
          text: "시장으로 옮긴 돈은 불어나 있었다. 현재로 돌아온 당신은 부자다.\n\n그러나 친구는 이미 세상에 없다. 당신의 성공을 가장 가까이서 지켜본 친구는 양조장과 자기 돈으로 레버리지 투자에 뛰어들었고, 빚과 수치심과 고립이 몇 년에 걸쳐 겹겹이 쌓였다.\n\n양조장이 있던 건물은 리모델링된 공유 오피스가 되었다. 유리 칸막이, 무향의 공조 — 쌀 냄새도 잉크 냄새도 없는 공기. 입주한 투자 컨설팅 업체는 당신이 투자한 회사다.\n\n로비에 서서, 당신은 한 문장을 삼킨다.\n\n이 돈의 첫 보증인은 그 애였다.",
          effects: { rel: "=0", brew: "=0", resp: +2 } },
        { when: { ledger: [1, 5] },
          text: "그날 맞춘 생산표는 벽에 붙은 채 낡아 있었다. 현재의 당신은 그 벽 앞에서 눈을 뜬다.\n\n친구는 옆에서 쌀을 찌고, 당신은 라벨 원고를 다듬는다. 함께 시작한 세월이 손에 배어 있다.\n\n통장은 얇다. 그래도 숫자를 같이 아는 살림이라, 얇은 대로 굴러간다.",
          effects: { brew: +1, money: -1 } },
        { when: { rel: [0, 2] },
          text: "보증을 정리하던 날의 서류가, 두 사람 사이의 마지막 공동 문서가 되었다.\n\n현재의 양조장은 그 자리에 있지만, 그 안에 당신의 자리는 없다. 친구는 혼자 쌀을 지고, 혼자 장부를 적는다. 빚진 것이 없는 사이는 생각보다 빨리 멀어진다.",
          effects: { rel: -1 } },
        { text: "현재로 돌아온다. 무엇도 크게 달라지지 않은 채, 당신의 자리만 조금 비어 있다.",
          effects: { rel: -1 } }
      ],
      carries: [
        { label: "옛 라벨 파일을 찾아 챙긴다", key: "c_label",
          variants: [
            { when: { money: [3, 5] },
              text: "공유 오피스 관리실의 유실물 상자에 오래된 USB가 있었다.\n\n열어 보니 창문 달 라벨의 최종본과, 저장된 적 없는 줄 알았던 초안들이 나란히 있다. 파일 이름은 친구가 붙인 것이다 — '우리 달_진짜최종'." },
            { text: "사무실 서랍에서 라벨 시안 묶음을 꺼낸다.\n\n맨 위 장의 여백에 친구의 글씨. '이거다.'\n\n당신은 그 장을 접어 가방에 넣는다." }
          ] },
        { label: "휴대폰의 오래된 메시지를 저장한다", key: "c_msg",
          variants: [
            { when: { money: [3, 5] },
              text: "몇 년 전 날짜에 멈춰 있는 문자 하나.\n\n'오늘 새 쌀 들어왔어. 시간 되면 와.'\n\n당신은 그날 가지 않았다. 화면을 오래 들여다보다가, 지우는 대신 보관함으로 옮긴다." },
            { text: "'오늘 새 쌀 들어왔어. 시간 되면 와.' — 얼마 전에 온 문자다.\n\n당신은 그것을 보관함에 따로 저장한다. 왜인지는 아직 모른 채." }
          ] },
        { label: "그 건물을 한 번 더 둘러본다", key: "c_place",
          variants: [
            { when: { money: [3, 5] },
              text: "로비 안내판에서 양조장의 이름은 지워졌다.\n\n그러나 뒷문 계단 난간에는 아직 쌀 포대가 쓸리며 남긴 흠집이 있다. 당신은 그 흠집을 손끝으로 짚어 본다." },
            { text: "양조장 뒷벽, 증기가 빠져나가는 배기구 아래 벽돌이 하얗게 세어 있다.\n\n세월이 밖으로 새어 나온 자리를, 당신은 오래 바라본다." }
          ] }
      ],
      next: { label: "두 번째 알약을 삼킨다", to: "2_개입" }
    },

    "2_개입": {
      turn: 3,
      text: "알약이 당신을 데려간 곳은 — 친구가 처음 투자 이야기를 꺼내던 날의 사무실이다.\n\n친구는 발효통 곁에 서서 휴대폰을 쥐고 있다. 화면과 발효통의 온도계를 번갈아 보다가, 별일 아니라는 듯 묻는다.\n\n\"요즘 다들 하는 그 투자… 나도 조금 해볼까?\"\n\n물음의 끝이 반쯤 웃음에 묻힌다. 당신은 이 질문의 무게를 안다. 그 뒤에 있는 것이 욕심이 아니라, 뒤처지고 싶지 않은 마음이라는 것도.",
      extras: [
        { when: { c_label: [1, 5] },
          text: "당신 가방에는 어제의 세계에서 가져온 라벨 파일이 들어 있다. '우리 달'이라는 이름을 붙인 사람이 지금 눈앞에서 웃고 있다." },
        { when: { c_msg: [1, 5] },
          text: "당신 휴대폰 보관함에는 '오늘 새 쌀 들어왔어'로 시작하는 문자가 저장되어 있다. 그 문장을 보낸 손이 지금 화면 위에서 머뭇거리고 있다." },
        { when: { c_place: [1, 5] },
          text: "계단 난간의 흠집을 짚었던 손끝의 감각이 아직 남아 있다. 그 흠집을 낼 쌀 포대가 지금 문가에 쌓여 있다." }
      ],
      inspects: [
        { label: "친구의 손을 바라본다", trace: "t_hand",
          text: "휴대폰 위의 엄지가 화면을 누르기 직전에 멈춰 있다.\n\n쌀을 쪄 온 손이다. 손등에는 김에 데인 오래된 자국, 손톱 밑에는 지워지지 않는 누룩빛. 그 손이 낯선 화면 위에서 갈 곳을 잃고 있다.\n\n망설임은 욕심보다 오래된 표정을 하고 있다." },
        { label: "발효통 곁에 선다", trace: "t_vat",
          text: "발효통 안에서 술이 익는 소리가 난다. 아주 작게, 비 오는 소리처럼.\n\n뚜껑에 붙은 온도 기록지에는 친구의 글씨로 시간마다 숫자가 적혀 있다. 새벽 세 시에도 한 줄이 있다.\n\n이 통 하나가 익는 동안, 저 화면의 숫자는 몇 번이나 오르내릴까." }
      ],
      choices: [
        { label: "끝을 봤다는 이야기를 꺼낸다", to: "2_현재",
          effects: { confess: +1, rel: -1, resp: +1 } },
        { label: "장부를 펼쳐 숫자부터 맞춘다", to: "2_현재",
          effects: { ledger: +1, rel: +1, brew: +1 } },
        { label: "모자란 금액을 먼저 메운다", to: "2_현재",
          effects: { patch: +1, money: -1, resp: +1 } }
      ]
    },

    "2_현재": {
      turn: 4,
      variants: [
        { when: { confess: [1, 5], money: [3, 5] },
          text: "끝을 봤다는 말은, 이 세계에는 닿지 못했다.\n\n현재는 달라지지 않았다. 친구는 없다. 앞서 가 있는 사람의 경고는 이렇게만 들렸을 것이다 — 너는 처음부터 알고 있었구나. 알면서 혼자 벌었구나.",
          effects: { resp: +1 } },
        { when: { money: [3, 5] },
          text: "그날 밤 무엇을 두고 왔든, 이 세계의 궤도는 이미 굳어 있었다.\n\n현재는 달라지지 않았다. 친구는 없다. 유리 칸막이 너머에서, 당신이 만든 부만 무성하다.",
          effects: { resp: +1 } },
        { when: { confess: [1, 5], rel: [4, 5] },
          text: "끝을 봤다는 말에, 친구는 멈춰 섰다.\n\n믿는 눈은 아니었다. 그래도 생산표를 같이 맞춰 온 세월이 그 말을 끝까지 듣게 했다. \"…네가 그렇게까지 말하면, 반만 하지.\"\n\n무리한 계약서는 서랍으로 들어갔다.",
          effects: { rel: +1, resp: -1 } },
        { when: { confess: [1, 5] },
          text: "끝을 봤다는 말은, 벌어진 사이를 건너지 못했다.\n\n친구에게 그것은 경고가 아니라 은폐로 들렸다 — 알고 있었으면서, 이제 와서. 친구는 더 깊이 고립된 채 계약서에 도장을 찍었다.",
          effects: { rel: -1 } },
        { when: { ledger: [1, 5] },
          text: "장부를 펼친 밤들이 시간을 조금 틀었다.\n\n나란히 앉아 맞춘 숫자 앞에서, 친구는 무리한 빚 대신 작은 걸음을 골랐다. 살림에 숨통이 트인다.",
          effects: { money: +1, rel: +1 } },
        { when: { patch: [1, 5] },
          text: "메워진 구멍을, 친구는 알아차리지 못했다.\n\n장부는 저절로 맞아떨어진 줄 안다. 그 숫자를 아는 사람은 당신뿐이고, 그런 숫자는 어디에도 적히지 않은 채 남는다.",
          effects: { resp: +1 } },
        { text: "그날의 대화는 흐지부지 끝났다. 친구는 여전히 뒤처지지 않으려는 마음을 혼자 굴리고, 당신의 자리는 그대로 비어 있다.",

      extras: [

            { text: "장부는 닫혀 있다. 당신은 표지만 찍는다.\n\n표지 모서리가 부풀어 있다 — 자주 쥐는 자리." }

    "3_개입": {
      turn: 5,

      extras: [
        { when: { c_paper: [1, 5] },

        { when: { c_page: [1, 5] },
          text: "휴대폰에는 장부를 찍은 사진이 한 장 들어 있다. 그 장부의 첫 페이지가, 지금 이 책상 위에서 아직 비어 있다." },
        { when: { c_sound: [1, 5] },
          text: "주머니 속 휴대폰에는 발효음 삼십 초가 저장되어 있다. 같은 소리가 지금 방 안에서 실제로 나고 있다." }
      ],
      inspects: [

        { label: "사무실 구석의 빈 책상을 본다", trace: "t_desk",

      choices: [

        { label: "일을 미룬 채 거리를 둔다", to: "3_현재",
          effects: { rel: -2, brew: -1 } },
        { label: "이름과 라벨만 맡는다", to: "3_현재",
          alts: [ { when: { c_label: [1, 5] }, label: "가져온 라벨 파일을 펼쳐 보이며, 이름과 라벨만 맡는다" } ],
          effects: { labelonly: +1, rel: +1, brew: +1 } }
      ]
    },

    "3_현재": {
      turn: 6,
      variants: [
        { when: { money: [3, 5], cosign: [1, 5] },
          text: "계약서에 이름을 올린 날부터, 부는 천천히 녹았다. 설비로, 쌀로, 세월로.\n\n통장은 얇아졌지만 그 자리에 친구가 살아 서 있다. 함께 빚은 병들이 동네 주점으로 나간다.\n\n그리고 골목 어귀에 — 재개발 공고가 붙었다.",
          effects: { money: "=1", rel: +1, brew: +1 } },
        { when: { money: [3, 5], labelonly: [1, 5] },
          text: "병은 당신의 그림을 입고 나가고, 당신의 통장은 다른 세계에서 부풀었다.\n\n친구는 살아 있다. 다만 장부의 무게는 혼자 지고 있다. 골목에는 재개발 공고가 붙었다.",
          effects: { rel: +1, brew: -1, resp: +1 } },
        { when: { money: [3, 5] },
          text: "그 세계의 유리 칸막이는 그대로다.\n\n소문의 골목도, 공고도, 이제는 당신과 상관없는 서류처럼 지나간다. 상관없다고 믿는 데에도 힘이 든다는 것만 다르다.",
          effects: { resp: +1 } },
        { when: { cosign: [1, 5], ledger: [1, 5] },
          text: "같은 계약서, 같은 장부.\n\n공고 앞에서 두 사람은 같은 숫자를 본다. 그래서 안다 — 옮기든 버티든, 지금 가진 돈으로는 모자란다는 것을.",
          effects: { resp: +1, money: -1 } },
        { when: { cosign: [1, 5] },
          text: "이름은 같은 종이에 올렸지만, 숫자는 각자 계산하고 있었다.\n\n재개발 공고 앞에서 두 사람의 셈이 처음으로 어긋난다.",
          effects: { rel: -1, resp: +1 } },
        { when: { labelonly: [1, 5] },
          text: "라벨은 당신의 것, 장부는 친구의 것.\n\n그렇게 나눈 반쪽짜리 곁으로는, 공고 한 장의 무게도 나눠지지 않는다.",

        { when: { rel: [0, 1] },
          text: "소식은 건너서 온다.\n\n양조장이 흔들린다는 소문, 조합이 돈다는 소문. 당신의 자리는 그 소문의 바깥이다.",
          effects: { rel: -1, resp: +1 } },
        { text: "양조장은 버티고 있지만, 골목에는 재개발 이야기가 돈다. 무게는 대부분 친구의 어깨에 있다.",
          effects: { brew: -1, resp: +1 } }
      ],
      extras: [
        { when: { c_page: [1, 5], cosign: [1, 5] },
          text: "당신 휴대폰 속 장부 사진 한 장이, 오늘의 숫자와 겹쳐 보인다. 같은 칸, 다른 세월." }
      ],
      carries: [
        { label: "공고문 귀퉁이를 뜯어 접는다", key: "c_notice",
          text: "게시판의 공고문 귀퉁이를 조금 뜯는다. '정비구역'이라는 넉 자가 손 안에서 접힌다.\n\n소문이 종이가 되면, 종이는 일정이 된다." },
        { label: "창문 달 한 병을 챙긴다", key: "c_bottle",
          text: "선반의 창문 달 한 병. 라벨 속 흰 달이 병 안의 뿌연 술과 같은 색이다.\n\n당신은 병을 천으로 감아 가방에 눕힌다." },

          text: "쌀 포대를 어깨에 얹는 순간의 친구를, 당신은 소리 없이 찍는다.\n\n화면 속에서 수건이 흘러내리고 있다." }
      ],
      next: { label: "네 번째 알약을 삼킨다", to: "4_개입" }
    },

    "4_개입": {
      turn: 7,
      text: "네 번째 알약. 재개발 조합 소문이 처음 돌던 날로 돌아온다.\n\n친구는 소문을 믿지 않는다. \"난 여기서 계속 빚을래.\"\n\n동네에는 폐업한 목욕탕이 하나 나와 있다. 깨진 파란 타일, 높은 천장, 눈높이보다 한참 위의 작은 창. 부동산에서 받아 온 조건 서류가 당신 가방 안에 있다 — 보증금과 설비 전환 비용의 숫자도 함께.",
      extras: [
        { when: { c_bottle: [1, 5] },
          text: "가방 안에서는 다른 세월의 창문 달 한 병이 천에 감긴 채 잠들어 있다. 이 병이 계속 태어나게 하는 것 — 그것이 이번에 돌아온 이유다." },
        { when: { c_photo: [1, 5] },
          text: "휴대폰에는 쌀 포대를 얹는 친구의 사진이 있다. 사진 속과 똑같은 어깨가 지금 눈앞에서 움직이고 있다." },
        { when: { c_notice: [1, 5] },
          text: "주머니에는 다른 세월의 공고문 조각이 접혀 있다. '정비구역' 넉 자. 지금 이 골목의 소문이 결국 어떤 종이가 되는지, 당신은 이미 만져 보았다." }
      ],
      inspects: [
        { label: "재개발 고시의 날짜를 읽는다", trace: "t_notice",
          text: "조합 사무실 앞 게시판, 고시문 하단의 날짜는 생각보다 가깝다.\n\n종이 위의 시간은 소문보다 빨리 걷는다. 당신은 그 숫자를 입 속으로 한 번 읽는다." },
        { label: "목욕탕 보일러실의 배수구를 들여다본다", trace: "t_drain",
          text: "낡은 배수구 덮개 아래로 물길이 마른 채 남아 있다. 물때가 그린 지도.\n\n물이 다니던 길은 지워지지 않았다.\n\n'여긴 물이 아직 길을 알고 있네' — 나중에 친구가 하게 될 말을, 당신은 미리 알고 있다." }
      ],
      choices: [
        { label: "목욕탕 조건을 함께 테이블 위에 올린다", to: "4_현재",
          effects: { table: +1, rel: +1, money: -1, resp: +1 } },
        { label: "조건은 내가 정리하겠다고 한다", to: "4_현재",
          effects: { solo: +1, brew: +1, resp: +2, money: -1 } },
        { label: "기존 설비를 끝까지 지킨다", to: "4_현재",
          effects: { stay: +1, rel: +1, money: +1 } }
      ]
    },

    "4_현재": {
      turn: 8,
      variants: [
        { when: { money: [3, 5], cosign: [0, 0], labelonly: [0, 0] },
          text: "소문의 날에 무엇을 두고 왔든, 이 세계의 창가에는 유리 칸막이가 서 있다.\n\n달라진 것은 당신이 그 앞을 그냥 지나치지 못하게 되었다는 것뿐이다.",
          effects: { resp: +1 } },
        { when: { solo: [1, 5] },
          text: "\"조건은 내가 정리할게\" — 그 말대로 서류는 깔끔했고, 목욕탕의 창문 달은 살아 있다. 깨진 파란 타일 사이로 김이 오르고, 탕 바닥이었던 자리에는 발효통이 놓였다.\n\n그러나 이전 뒤의 긴 휴업과 매출 공백이, 당신 혼자 이름을 적은 종이를 깨웠다. 방 문틈에 등기 봉투가 꽂혀 있다. '보증채무 이행 요청'. 맨 아래, 그날의 서명.\n\n친구는 모른다. 휴대폰이 울린다. '오늘 새 쌀 들어왔어. 시간 되면 와.'",
          effects: { money: "=0", rel: -1, resp: "=5" } },
        { when: { table: [1, 5], ledger: [1, 5] },
          text: "테이블 위에 올린 조건과, 같이 맞춰 온 장부가 나란히 놓였다.\n\n목욕탕의 창문 달이 익는다. 파란 타일 위로 김이 오르고, 높은 창으로 달빛이 내려와 빈 탕 바닥에 고인다.\n\n이전 뒤의 휴업도, 빚도 무겁다 — 그러나 그 숫자는 두 사람 앞에 펼쳐져 있고, 둘 다 안다.",
          effects: { money: -1, rel: +1, resp: +1 } },
        { when: { table: [1, 5], patch: [1, 5] },
          text: "조건은 함께 올렸지만, 그 시절 몰래 끌어다 메운 돈이 휴업의 공백 속에서 이자가 되어 돌아왔다.\n\n함께 보던 숫자 옆에, 당신만 아는 청구서가 한 장 끼어 있다.",
          effects: { money: "=0", resp: +2, rel: -1 } },
        { when: { table: [1, 5] },
          text: "조건은 테이블 위에 올랐다. 그리고 두 사람은 같은 결론 앞에 앉았다 — 이 돈으로는 못 옮긴다.\n\n목욕탕 문은 열어 보지도 못했고, 공고 아래의 양조장으로 돌아왔다.",
          effects: { brew: -1, resp: +1 } },
        { when: { stay: [1, 5], patch: [1, 5] },
          text: "남기로 했다. 통장도, 아침 인사도 아직 그대로다.\n\n확정 고시가 붙어 시간이 줄었을 뿐, 문은 오늘도 열린다. 다만 그때 몰래 메운 숫자는, 아직 장부 밖 어딘가에서 잠들어 있다.",
          effects: { resp: +1 } },
        { when: { stay: [1, 5] },
          text: "남기로 했다. 옮기는 돈도, 낯선 계약서도 없으니 통장과 아침 인사는 그대로다.\n\n대신 골목 끝에 확정 고시가 붙었다. 문은 오늘도 열린다. 시간이 줄었을 뿐이다.",
          effects: { resp: +1 } },
        { text: "소문은 공고가 되었고, 공고는 일정이 되었다.\n\n당신은 그 골목을 창밖처럼 지나간다.",
          effects: { brew: -1, rel: -1 } }
      ],
      extras: [
        { when: { table: [1, 5], ledger: [1, 5], t_edge: [1, 5] },
          text: "계약서를 펼 때 당신은 오래전 보증서 가장자리의 접힌 자국을 떠올렸다. 그래서 이번 서류의 서명란은 처음부터 두 줄로 만들었다 — 나란히, 같은 크기로." },
        { when: { solo: [1, 5], c_msg: [1, 5] },
          text: "휴대폰 보관함에는 오래전에 저장해 둔 같은 문장이 있다. '오늘 새 쌀 들어왔어. 시간 되면 와.'\n\n같은 문장이 두 번, 서로 다른 세월에서 도착해 있다. 당신은 이번에는, 가겠다고 답장한다." }
      ],
      carries: [
        { label: "그날 밤의 골목을 한 번 더 걷는다", key: "c_walk",
          variants: [
            { when: { solo: [1, 5] },
              text: "등기 봉투를 가방에 넣은 채 골목을 걷는다. 목욕탕 굴뚝 위로 달이 걸려 있다.\n\n창문 달은 오늘도 익는다. 그 값을 아는 사람이 혼자라는 것만 빼면, 좋은 밤이다." },
            { when: { brew: [4, 5] },
              text: "목욕탕 높은 창에 달이 걸리는 시간까지 걷는다. 파란 타일이 밤에는 검게 보인다.\n\n김 냄새와 누룩 냄새가 골목 끝까지 따라온다." },
            { text: "공고가 붙은 골목을 끝까지 걷는다. 가로등 하나가 깜빡이고, 양조장 창에는 아직 불이 있다.\n\n불이 있는 동안은, 아직 이야기가 끝난 것이 아니다." }
          ] },
        { label: "휴대폰의 최근 문자를 다시 읽는다", key: "c_text8",

        { label: "손에 잡히는 것 하나를 주머니에 넣는다", key: "c_piece",
          variants: [

              text: "목욕탕 입구에 떨어져 있던 파란 타일 조각 하나.\n\n모서리가 닳아 손을 베지 않는다. 당신은 그것을 주머니에 넣는다." },
            { text: "게시판 아래 떨어진 압정 하나를 줍는다. 공고문을 붙들고 있던 것이다.\n\n작고, 차갑고, 뾰족하다. 당신은 그것을 주머니에 넣는다." }

      ],
      next: { label: "마지막 알약을 꺼내 든다", to: "기억지도" }

    "기억지도": {

        { label: "돈이 생긴 날",

        { label: "보증 도장을 찍은 그날",
          variants: [

/* ═══ 2. 엔진 — 건드리지 않는다 ═══ */
const state = {};
let current = null; /* {node, text} — 현재 턴의 확정 본문(변형·덧글 반영 후) */

function resetState(){ Object.assign(state, GAME.initialState); }
function clamp(v){ return Math.max(0, Math.min(5, v)); }
function applyEffects(eff){
  if(!eff) return;
  for(const k in eff){
    const v = eff[k];
    state[k] = clamp(typeof v === "string" ? parseInt(v.slice(1), 10) : state[k] + v);
  }
}
function matches(when){
  if(!when) return true;
  return Object.keys(when).every(k => state[k] >= when[k][0] && state[k] <= when[k][1]);
}
/* 효과 없이 텍스트만 고르는 해석기(살펴보기·흔적·성찰용) */
function pickText(obj){
  if(obj.variants){ const v = obj.variants.find(v => matches(v.when)); return v.text; }
  return obj.text;
}
function renderPanel(){
  document.getElementById("panel").innerHTML = GAME.panel
    .map(p => p.name + " <b>" + p.labels[state[p.key]] + "</b>")
    .join(" &nbsp;·&nbsp; ");
}
function setText(t){ document.getElementById("text").innerHTML = t.replace(/\n/g, "<br>"); }
function button(label, cls, fn){
  const b = document.createElement("button"); b.className = cls; b.textContent = label;
  b.onclick = fn; return b;
}
/* 짧은 하위 장면: 본문을 바꾸고 버튼 목록만 보여 준다. 턴·패널은 유지. */
function showSub(text, buttons){
  setText(text);
  const c = document.getElementById("choices"); c.innerHTML = "";
  buttons.forEach(bt => c.appendChild(button(bt.label, "choice", bt.fn)));
}
function go(id){
  const n = GAME.nodes[id]; if(!n){ console.error("없는 노드: " + id); return; }
  let text = n.text;
  if(n.variants){
    const v = n.variants.find(v => matches(v.when));
    text = v.text;
    applyEffects(v.effects);
  }
  const extra = (n.extras || []).filter(e => matches(e.when)).map(e => e.text);
  current = { node: n, text: [text].concat(extra).join("\n\n") };
  renderCurrent();
}
function renderCurrent(){
  const n = current.node;
  document.getElementById("turn").textContent = n.turn ? n.turn + "/" + GAME.totalTurns : "";
  setText(current.text);
  renderPanel();
  const c = document.getElementById("choices"); c.innerHTML = "";
  const slot = document.getElementById("itch-slot"); slot.innerHTML = "";

  if(n.map){
    n.places.forEach(p => {
      c.appendChild(button(p.label, "choice", () => {
        if(p.to){ go(p.to); }
        else showSub(pickText(p), [{ label: "지도로 돌아간다", fn: renderCurrent }]);
      }));
    });
    return;
  }
  if(n.carries){
    n.carries.forEach(cd => {
      c.appendChild(button(cd.label, "choice", () => {
        state[cd.key] = 1;
        showSub(pickText(cd), [{ label: n.next.label, fn: () => go(n.next.to) }]);
      }));
    });
    return;
  }
  (n.inspects || []).forEach(ins => {
    c.appendChild(button(ins.label, "inspect", () => {
      state[ins.trace] = 1;
      showSub(pickText(ins), [{ label: "장면으로 돌아간다", fn: renderCurrent }]);
    }));
  });
  (n.choices || []).forEach(ch => {
    let label = ch.label;
    if(ch.alts){ const a = ch.alts.find(a => matches(a.when)); if(a) label = a.label; }
    c.appendChild(button(label, "choice", () => { applyEffects(ch.effects); go(ch.to); }));
  });
  if(n.end){
    if(GAME.itchUrl){
      const a = document.createElement("a"); a.href = GAME.itchUrl;
      a.textContent = GAME.itchLabel || GAME.itchUrl;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      slot.appendChild(a);
    }
    c.appendChild(button("처음부터", "choice", () => { resetState(); go(GAME.start); }));
  }
}
document.getElementById("title").textContent = GAME.title;
document.title = GAME.title;
resetState();
go(GAME.start);
</script>
