  #inner{width:100%;max-width:40em}

  .inner{color:rgba(190,205,225,.82);font-style:italic}
  .sound{color:rgba(160,185,215,.8);font-style:italic;margin-top:1em;font-size:.95rem}

  .choice{display:block;margin:8px 0;padding:13px 20px;width:100%;text-align:center;
          font:inherit;font-size:.98rem;color:#fff;cursor:pointer;
          background:rgba(28,32,40,.62);backdrop-filter:blur(8px);
          border:1px solid rgba(255,255,255,.16);border-radius:3px;
          transition:background .2s,border-color .2s}
  .choice:hover{background:rgba(46,52,62,.82);border-color:rgba(255,255,255,.4)}

  select,input{font:inherit;font-size:.98rem;width:100%;margin:8px 0;padding:13px 20px;
               color:#fff;background:rgba(28,32,40,.62);backdrop-filter:blur(8px);
               border:1px solid rgba(255,255,255,.16);border-radius:3px;text-align:center;
               text-align-last:center}
  select option{background:#1b1f27;color:#fff}

  #clues{margin-top:16px;font-size:.78rem;letter-spacing:.06em;text-align:center;
         color:rgba(255,255,255,.42);line-height:1.8;
         text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .on{color:rgba(232,206,140,.95)}

       width:34px;height:34px;line-height:32px;text-align:center;cursor:pointer;
       font-family:sans-serif;font-size:15px;color:rgba(255,255,255,.55);
       background:rgba(28,32,40,.5);backdrop-filter:blur(6px);

      text: "호진이가 웃는다.\n\"그럼 나 잡은 거네.\"\n\n아, 하고 소리가 났다. 내 입에서.\n\n열둘까지 세다 말았다. 나무에 얼굴을 묻고,\n열둘까지 세고, 그다음이 기억이 안 나서\n그냥 앉아 있었다. 계속.\n\n주머니에서 머리핀이 떨어진다.\n담장 위에서 향숙이가 소리친다. \"야! 그거 내 거야!\"\n\n여기저기서 애들이 튀어나온다.\n다들 아까부터 거기 있었다.",
      end: true
    },
    "골목엔딩": {
      img: "골목엔딩",
      snd: { dist: 1, tone: "dusk", stop: true, song: { vol:.13, cut:true, cold:1, wait:3 } },
      text: "호진이가 잠깐 나를 본다.\n뭔가 말하려다 만다.\n\"…응. 그럼 여기 있어.\"\n\n그리고 뛰어간다.\n골목 끝에서 웃음소리가 나고, 여러 명이 흩어지는 소리가 나고,\n조용해진다.\n\n해가 넘어간다.\n나는 주머니가 무거운 채로 앉아 있다.\n갖다줄 사람을 아직 못 찾았다.",
      end: true
    }

};

/* ═══ 사운드 엔진 — 전부 브라우저에서 합성. 파일 없음 ═══ */
const SND = (() => {
  let ac, on = true, master, ambGain, ambFilt, cntGain, cntFilt, echo, echoGain, timer, cur = {dist:.8, tone:"open"};

  function noiseBuf(){
    const n = ac.sampleRate * 4, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for(let i=0;i<n;i++){ const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.5; }
    return b;
  }

  function init(){
    if(ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = on ? .9 : 0; master.connect(ac.destination);

    // 바람 / 공기 — 필터 건 노이즈
    const src = ac.createBufferSource(); src.buffer = noiseBuf(); src.loop = true;
    ambFilt = ac.createBiquadFilter(); ambFilt.type = "lowpass"; ambFilt.frequency.value = 700;
    ambGain = ac.createGain(); ambGain.gain.value = .055;
    src.connect(ambFilt); ambFilt.connect(ambGain); ambGain.connect(master); src.start();

    // 숫자 세는 소리 — 거리에 따라 흐려지는 펄스
    cntFilt = ac.createBiquadFilter(); cntFilt.type = "lowpass"; cntFilt.frequency.value = 500;
    cntGain = ac.createGain(); cntGain.gain.value = .1;
    cntFilt.connect(cntGain); cntGain.connect(master);

    echo = ac.createDelay(1); echo.delayTime.value = .26;
    echoGain = ac.createGain(); echoGain.gain.value = 0;
    cntFilt.connect(echo); echo.connect(echoGain); echoGain.connect(echo); echoGain.connect(master);

    tick();
  }

  // 한 번의 "세는" 소리. 사람 목소리가 아니라, 멀리서 웅얼거리는 두 음절.
  function count(){
    if(!ac || cur.stop) return;
    const t = ac.currentTime;
    [0, .17].forEach((off, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(i ? 232 : 196, t+off);
      o.frequency.exponentialRampToValueAtTime(i ? 205 : 214, t+off+.16);
      g.gain.setValueAtTime(0, t+off);
      g.gain.linearRampToValueAtTime(.9, t+off+.03);
      g.gain.exponentialRampToValueAtTime(.001, t+off+.22);
      o.connect(g); g.connect(cntFilt); o.start(t+off); o.stop(t+off+.3);
    });
  }

  function tick(){
    clearTimeout(timer);
    count();
    timer = setTimeout(tick, 2400 + Math.random()*900);
  }


  // 「꼭꼭 숨어라 머리카락 보일라」 — 전래동요. 단조 5음계로 낮춰서 싸늘하게.
  // A단 5음계: A3 220 / C4 261.63 / D4 293.66 / E4 329.63 / G4 392
  const A3=220, C4=261.63, D4=293.66, E4=329.63, G4=392;
  //          꼭    꼭    숨    어    라   |  머    리    카    락    보    일    라
  const MELODY = [E4,  E4,  D4,  C4,  D4,   null, C4,  D4,  E4,  E4,  D4,  C4,  A3];

  let songTimer;
  // cut: 마지막 음절을 안 부르고 끊는다 ("부르다 만 노래")
  function song(opt){
    if(!ac || !on) return;
    const o = Object.assign({ vol:.13, cut:true, cold:1, delay:0 }, opt || {});
    const t0 = ac.currentTime + o.delay, step = .46;
    const notes = o.cut ? MELODY.slice(0, MELODY.length-1) : MELODY;

    const bus = ac.createGain(); bus.gain.value = o.vol;
    const lp  = ac.createBiquadFilter(); lp.type="lowpass";
    lp.frequency.value = 900 + (1-o.cold)*1600;               // 차가울수록 먹먹하게
    const dl  = ac.createDelay(1); dl.delayTime.value = .33;
    const fb  = ac.createGain(); fb.gain.value = .34 + o.cold*.14;
    bus.connect(lp); lp.connect(master);
    lp.connect(dl); dl.connect(fb); fb.connect(dl); fb.connect(master);

    notes.forEach((f, i) => {
      if(f === null) return;                                   // 쉼표
      const t = t0 + i*step;
      // 두 음을 미세하게 어긋나게 겹친다 — 이게 싸늘함의 정체
      [0, o.cold*13].forEach((cents, k) => {
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.type = k ? "sine" : "triangle";
        osc.frequency.value = f; osc.detune.value = cents;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(k ? .34 : .5, t + .05);
        g.gain.setValueAtTime(k ? .34 : .5, t + step*.62);
        g.gain.exponentialRampToValueAtTime(.001, t + step*1.15);
        osc.connect(g); g.connect(bus);
        osc.start(t); osc.stop(t + step*1.2);
      });
    });
  }

  const TONE = {
    open:   { amb: 700,  ambV: .055, echo: .06 },
    tunnel: { amb: 260,  ambV: .105, echo: .45 },
    high:   { amb: 1500, ambV: .085, echo: .10 },
    forest: { amb: 900,  ambV: .075, echo: .05 },
    dusk:   { amb: 420,  ambV: .05,  echo: .08 }
  };

  function set(cfg){
    cur = cfg || {dist:.8, tone:"open"};
    clearTimeout(songTimer);
    if(!ac) return;
    if(cur.song) songTimer = setTimeout(() => song(cur.song), (cur.song.wait || 1) * 1000);
    const t = ac.currentTime, T = TONE[cur.tone] || TONE.open, d = cur.dist;
    ambFilt.frequency.setTargetAtTime(T.amb, t, .5);
    ambGain.gain.setTargetAtTime(T.ambV, t, .5);
    echoGain.gain.setTargetAtTime(T.echo, t, .5);
    // 멀수록 작고 먹먹하게
    cntFilt.frequency.setTargetAtTime(300 + (1-d)*2200, t, .6);
    cntGain.gain.setTargetAtTime(cur.stop ? 0 : .04 + (1-d)*.30, t, .6);
  }

  function click(){
    if(!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(680, t);
    o.frequency.exponentialRampToValueAtTime(340, t+.07);
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t+.09);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.1);
  }

  function toggle(){
    on = !on;
    if(ac) master.gain.setTargetAtTime(on ? .9 : 0, ac.currentTime, .1);
    return on;
  }

  return { init, set, click, toggle, song };
})();

document.getElementById("snd").onclick = e => {
  e.stopPropagation();
  document.getElementById("snd").textContent = SND.toggle() ? "♪" : "✕";
};

/* ═══ 화면 반전 — ◐ 버튼으로 전환 ═══ */
// 0 원본 · 1 야경 반전(명암만 뒤집고 색은 유지) · 2 완전 반전(색까지 뒤집힘)
const INV = [
  { f: "none",                                        label: "○" },
  { f: "invert(1) hue-rotate(180deg) saturate(1.15)", label: "◐" },
  { f: "invert(1) saturate(1.05)",                    label: "●" }
];
let invMode = 1;
function applyInv(){
  const f = INV[invMode].f;
  document.getElementById("bg").style.filter = f;
  document.getElementById("bg2").style.filter = f;
  document.getElementById("inv").textContent = INV[invMode].label;
}
document.getElementById("inv").onclick = e => {
  e.stopPropagation();
  invMode = (invMode + 1) % INV.length;
  applyInv();
};
applyInv();

/* ═══ 배경 크로스페이드 ═══ */
let frontIsA = true;
function setBG(url){
  const a = document.getElementById("bg"), b = document.getElementById("bg2");
  const front = frontIsA ? a : b, back = frontIsA ? b : a;
  back.style.backgroundImage = url ? 'url("'+url+'")' : "none";
  back.style.filter = INV[invMode].f;
  back.style.opacity = 1; front.style.opacity = 0;
  frontIsA = !frontIsA;
}
Object.values(IMG).forEach(u => { const i = new Image(); i.src = u; });

/* ═══ 2. 엔진 — 건드리지 않는다 ═══ */
const flags = new Set();
const found = new Set();

function go(id){
  const n = GAME.nodes[id]; if(!n){ alert("없는 노드: " + id); return; }
  let text = n.text;
  if(n.alt && flags.has(n.alt.flag)) text = n.alt.text;
  if(n.gives) flags.add(n.gives);
  if(n.also)  flags.add(n.also);
  if(n.finds) found.add(n.finds);

  setBG(n.img && IMG[n.img] ? IMG[n.img] : null);
  SND.set(n.snd);

  let html = text.replace(/\n/g,"<br>");
  if(n.sound) html += '<div class="sound">' + n.sound + '</div>';
  document.getElementById("text").innerHTML = html;

  const c = document.getElementById("choices"); c.innerHTML = "";
  if(n.question){
    const q = n.question; let el;
    if(q.input){ el = document.createElement("input"); }
    else { el = document.createElement("select");
      el.innerHTML = '<option value="">— 선택 —</option>' + q.options.map(o=>"<option>"+o+"</option>").join(""); }
    const b = document.createElement("button"); b.className = "choice"; b.textContent = "대답한다";
    b.onclick = () => { SND.init(); SND.click(); go(el.value.trim() === q.answer ? q.to : q.wrongTo); };
    c.append(el, b);
  } else {
    (n.choices||[]).forEach(ch => {
      if(ch.requires && !ch.requires.every(f=>flags.has(f))) return;
      if(ch.needFriends && found.size < ch.needFriends) return;
      const b = document.createElement("button"); b.className = "choice"; b.textContent = ch.label;
      b.onclick = () => { SND.init(); SND.click(); go(ch.to); }; c.appendChild(b);
    });
  }
  if(n.end){
    const b = document.createElement("button"); b.className = "choice"; b.textContent = "처음부터";
    b.onclick = () => { SND.click(); flags.clear(); found.clear(); go(GAME.start); }; c.appendChild(b);
  }

  const names = FRIENDS.map(f => found.has(f) ? '<span class="on">'+f+'</span>' : "·").join("  ");
  const line2 = flags.size ? "<br>알게 된 것: " + [...flags].join(", ") : "";
  document.getElementById("clues").innerHTML =
    "여기 있었다: " + names + "  (" + found.size + "/7)" + line2;
}
document.getElementById("title").textContent = GAME.title;
document.title = GAME.title;
go(GAME.start);
</script>
