<script>

        { label: "새 장소를 밀어붙이고, 모자란 돈은 친구 몰래 개인 보증으로 메운다", to: "4_현재",
          effects: { brew: +2, resp: +3, money: -1, secret: +1 } },

    "4_현재": {

/* ═══ 2. 엔진 — 건드리지 않는다 ═══ */
const state = {};
function resetState(){ Object.assign(state, GAME.initialState); }
function clamp(v){ return Math.max(0, Math.min(5, v)); }
function applyEffects(eff){
  if(!eff) return;
  for(const k in eff){
    const v = eff[k];
    state[k] = clamp(typeof v === "string" ? parseInt(v.slice(1), 10) : state[k] + v);
  }
}
function matches(when){
  if(!when) return true;
  return Object.keys(when).every(k => state[k] >= when[k][0] && state[k] <= when[k][1]);
}
function renderPanel(){
  document.getElementById("panel").innerHTML = GAME.panel
    .map(p => p.name + " <b>" + p.labels[state[p.key]] + "</b>")
    .join(" &nbsp;·&nbsp; ");
}
function go(id){
  const n = GAME.nodes[id]; if(!n){ console.error("없는 노드: " + id); return; }
  let text = n.text;
  if(n.variants){
    const v = n.variants.find(v => matches(v.when));
    text = v.text;
    applyEffects(v.effects);
  }
  document.getElementById("turn").textContent = n.turn ? n.turn + "/" + GAME.totalTurns : "";
  document.getElementById("text").innerHTML = text.replace(/\n/g, "<br>");
  renderPanel();
  const c = document.getElementById("choices"); c.innerHTML = "";
  const slot = document.getElementById("itch-slot"); slot.innerHTML = "";
  if(n.question){
    const q = n.question;
    q.options.forEach(opt => {
      const b = document.createElement("button"); b.className = "choice"; b.textContent = opt;
      b.onclick = () => go(opt === q.answer ? q.to : q.wrongTo);
      c.appendChild(b);
    });
  } else {
    (n.choices || []).forEach(ch => {
      const b = document.createElement("button"); b.className = "choice"; b.textContent = ch.label;
      b.onclick = () => { applyEffects(ch.effects); go(ch.to); };
      c.appendChild(b);
    });
  }
  if(n.end){
    if(GAME.itchUrl){
      const a = document.createElement("a"); a.href = GAME.itchUrl; a.textContent = GAME.itchUrl;
      slot.appendChild(a);
    }
    const b = document.createElement("button"); b.className = "choice"; b.textContent = "처음부터";
    b.onclick = () => { resetState(); go(GAME.start); }; c.appendChild(b);
  }
}
document.getElementById("title").textContent = GAME.title;
document.title = GAME.title;
resetState();
go(GAME.start);
</script>
</body>
</html>
