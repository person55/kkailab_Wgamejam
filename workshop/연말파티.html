  ◆ 핫스팟은 기본적으로 은은한 점(마커)으로 항상 보입니다.

-->
<style>
  :root{--ink:#e8e4d8;--ink-dim:#9a9788;--night:#0d1420;--panel:#16202e;
        --panel-edge:#2b3a4d;--accent:#d8b45a;--accent-dim:#8a7538;--warm:#c96a4a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--night);color:var(--ink);
       font-family:"Noto Serif KR","Nanum Myeongjo",serif;min-height:100vh;overflow-x:hidden;}
  .screen{display:none;width:100%;}
  .screen.active{display:block;}

  #screen-title{text-align:center;padding:10vh 20px;min-height:100vh;
    background:radial-gradient(ellipse at 50% 90%,rgba(201,106,74,.28),transparent 62%),
               linear-gradient(180deg,#0a0f1a 0%,#141c26 55%,#1d2430 100%);
    background-size:cover;background-position:center;}
  #screen-title h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.35em;text-indent:.35em;
    color:var(--accent);margin-bottom:.5em;text-shadow:0 0 40px rgba(0,0,0,.9);}
  #screen-title .subtitle{color:var(--ink-dim);letter-spacing:.2em;margin-bottom:7vh;
    text-shadow:0 0 20px rgba(0,0,0,.9);}
  .lamp{width:80px;height:80px;border-radius:50%;margin:0 auto 5vh;
    background:radial-gradient(circle at 40% 35%,#f7e6c0,#d9b070 65%,#8a6a3c);
    box-shadow:0 0 70px 24px rgba(216,180,90,.18);}
  button.big{font-family:inherit;font-size:1.05rem;letter-spacing:.3em;text-indent:.3em;
    color:var(--accent);background:rgba(8,12,20,.5);border:1px solid var(--accent-dim);
    padding:.9em 2.6em;cursor:pointer;transition:background .25s,box-shadow .25s;}
  button.big:hover{background:rgba(216,180,90,.14);box-shadow:0 0 24px rgba(216,180,90,.15);}

  #screen-intro{text-align:center;padding:18vh 20px;min-height:100vh;cursor:pointer;}
  #intro-line{font-size:clamp(1.05rem,2.6vw,1.4rem);line-height:2.1;
    max-width:32em;margin:0 auto 8vh;min-height:5em;}
  .hint{color:var(--ink-dim);font-size:.82rem;letter-spacing:.1em;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    max-width:1100px;margin:0 auto;padding:14px 18px;flex-wrap:wrap;gap:8px;}
  .topbar .place{letter-spacing:.25em;color:var(--accent);}
  .topbar .right{display:flex;gap:10px;flex-wrap:wrap;}
  button.small{font-family:inherit;font-size:.82rem;color:var(--ink);background:var(--panel);
    border:1px solid var(--panel-edge);padding:.5em 1.1em;cursor:pointer;letter-spacing:.1em;}
  button.small:hover{border-color:var(--accent-dim);color:var(--accent);}

  #screen-hub{min-height:100vh;padding-bottom:6vh;}
  #hub-incident{max-width:38em;margin:4vh auto 5vh;padding:0 20px;
    text-align:center;line-height:1.95;}
  #hub-incident em{color:var(--accent);font-style:normal;}
  .hub-cards{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;
    max-width:1000px;margin:0 auto;padding:0 20px;}
  .hub-card{width:250px;height:160px;border:1px solid var(--panel-edge);
    cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;}
  .hub-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .hub-card .bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  .hub-card .name{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;
    background:linear-gradient(transparent,rgba(8,12,20,.94));letter-spacing:.2em;}
  .hub-card.visited::after{content:"다녀옴";position:absolute;top:10px;right:10px;
    font-size:.68rem;color:var(--ink-dim);border:1px solid var(--panel-edge);
    background:rgba(8,12,20,.7);padding:2px 8px;letter-spacing:.1em;}
  #hub-advance-wrap{text-align:center;margin-top:7vh;}

  #screen-scene{min-height:100vh;}
  #stage-wrap{display:flex;justify-content:center;padding:0 18px;}
  #stage{position:relative;width:min(1060px,96vw);aspect-ratio:16/9;
    background-size:cover;background-position:center;
    border:1px solid var(--panel-edge);overflow:hidden;user-select:none;}

  /* ── 핫스팟: 항상 은은한 마커로 보인다 ── */
  .hotspot{position:absolute;cursor:pointer;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;transition:border-color .2s,background .2s;}
  .hotspot .dot{width:11px;height:11px;border-radius:50%;
    background:rgba(216,180,90,.85);box-shadow:0 0 0 5px rgba(216,180,90,.14),0 0 16px rgba(216,180,90,.5);
    animation:pulse 2.6s ease-in-out infinite;pointer-events:none;}
  .hotspot.done .dot{background:rgba(154,151,136,.55);box-shadow:0 0 0 4px rgba(154,151,136,.10);animation:none;}
  .hotspot.fresh .dot{background:rgba(201,106,74,.95);box-shadow:0 0 0 6px rgba(201,106,74,.18),0 0 20px rgba(201,106,74,.6);}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.18);}}
  .hotspot .tag{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%) translateY(100%);
    white-space:nowrap;font-size:.72rem;letter-spacing:.08em;color:var(--accent);
    background:rgba(8,12,20,.88);border:1px solid var(--panel-edge);padding:2px 8px;
    opacity:0;transition:opacity .18s;pointer-events:none;}
  .hotspot:hover{border-color:rgba(216,180,90,.55);background:rgba(216,180,90,.07);}
  .hotspot:hover .tag{opacity:1;}
  body.show-hotspots .hotspot{border-color:rgba(216,180,90,.45);background:rgba(216,180,90,.06);}
  body.show-hotspots .hotspot .tag{opacity:1;}

  #textbox{position:absolute;left:3%;right:3%;bottom:4%;background:rgba(8,12,20,.95);

    cursor:pointer;display:none;max-height:74%;overflow-y:auto;}
  #textbox.open{display:block;}
  #textbox .speaker{color:var(--accent);letter-spacing:.15em;margin-bottom:8px;font-size:.88rem;}
  #textbox .continue{color:var(--ink-dim);font-size:.72rem;text-align:right;margin-top:10px;}
  .ans{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--panel-edge);}
  .ans .who{color:var(--accent);font-size:.8rem;letter-spacing:.1em;display:block;margin-bottom:2px;}

  #notebook{position:fixed;top:0;right:-400px;bottom:0;width:370px;max-width:90vw;
    background:var(--panel);border-left:1px solid var(--panel-edge);padding:24px 20px 40px;

  #notebook.open{right:0;}
  #notebook h2{letter-spacing:.25em;color:var(--accent);font-size:1rem;margin-bottom:4px;}
  #notebook .sub{color:var(--ink-dim);font-size:.72rem;letter-spacing:.12em;margin-bottom:18px;}
  #notebook h3{letter-spacing:.15em;color:var(--ink-dim);font-size:.76rem;
    margin:24px 0 10px;border-top:1px solid var(--panel-edge);padding-top:13px;}
  #notebook-close{position:absolute;top:14px;right:14px;width:36px;height:36px;
    font-size:1.3rem;line-height:1;color:var(--ink);background:transparent;
    border:1px solid var(--panel-edge);border-radius:4px;cursor:pointer;}
  .clue-item{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--panel-edge);}
  .clue-item .n{color:var(--accent);letter-spacing:.1em;margin-bottom:3px;font-size:.9rem;}
  .clue-item .d{color:var(--ink-dim);font-size:.83rem;line-height:1.7;}
  .clue-empty{color:var(--ink-dim);font-size:.85rem;line-height:1.8;}
  .chart{border:1px solid var(--panel-edge);padding:10px 12px;margin-bottom:10px;}
  .chart .who{color:var(--accent);font-size:.86rem;letter-spacing:.1em;
    display:flex;justify-content:space-between;align-items:baseline;}
  .chart .cnt{font-family:monospace;font-size:.78rem;color:var(--ink-dim);}
  .chart .cnt.zero{color:var(--warm);}
  .chart ul{list-style:none;margin-top:7px;}
  .chart li{color:var(--ink-dim);font-size:.8rem;line-height:1.65;padding-left:11px;position:relative;}
  .chart li::before{content:"·";position:absolute;left:0;color:var(--accent-dim);}
  .chart .none{color:#5d6b7d;font-size:.78rem;margin-top:6px;}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:-70px;
    background:var(--panel);border:1px solid var(--accent-dim);color:var(--accent);
    padding:.7em 1.6em;letter-spacing:.1em;font-size:.86rem;transition:bottom .35s;z-index:50;}
  #toast.show{bottom:34px;}

  #screen-deduce{min-height:100vh;}
  #deduce-inner{max-width:36em;margin:0 auto;padding:4vh 20px 10vh;}
  #deduce-inner .lead{line-height:2;margin-bottom:3vh;}
  #deduce-clue-note{color:var(--ink-dim);font-size:.86rem;line-height:1.8;margin-bottom:4vh;
    border-left:2px solid var(--panel-edge);padding-left:14px;}
  .q-prompt{color:var(--accent);letter-spacing:.1em;margin-bottom:14px;}
  .opt{display:block;margin:8px 0;padding:10px 16px;border:1px solid var(--panel-edge);
    color:var(--ink);cursor:pointer;background:none;width:100%;text-align:left;font:inherit;}
  .opt:hover{background:rgba(216,180,90,.08);}
  .opt.sel{border-color:var(--accent);color:var(--accent);}
  #deduce-submit-wrap{text-align:center;margin-top:5vh;}

  #screen-end{min-height:100vh;text-align:center;padding:12vh 20px;}
  #end-title{color:var(--accent);letter-spacing:.3em;font-size:1.5rem;margin-bottom:4vh;}
  #end-text{max-width:32em;margin:0 auto 7vh;line-height:2.1;text-align:left;white-space:pre-wrap;}

  #edit-panel{display:none;position:fixed;left:14px;bottom:14px;background:var(--panel);
    border:1px solid var(--accent-dim);color:var(--accent);padding:10px 14px;
    font-size:.78rem;line-height:1.7;z-index:60;}
  #edit-rect{position:absolute;border:1px solid var(--accent);
    background:rgba(216,180,90,.12);display:none;pointer-events:none;}
</style>
</head>

  <button id="notebook-close" onclick="closeNotebook()" aria-label="닫기">&times;</button>
  <h2>인계장</h2>
  <div class="sub">기록해두지 않으면 다음 근무자가 모른다</div>
  <h3>관찰 기록</h3>
  <div id="notebook-list"></div>
  <h3>인물 차트 · 남편이 이름을 부른 횟수</h3>
  <div id="notebook-charts"></div>
</div>

<div id="toast"></div>

<div id="edit-panel">
  편집 모드 (E 로 종료)<br>화면 위에서 드래그하면 좌표가 나옵니다<br>
  <span id="edit-out">{ x: -, y: -, w: -, h: - }</span>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     2. 엔진  —  고치지 않아도 됩니다
     ═══════════════════════════════════════════════════════════════ -->
<script>
const state = {
  clues: new Set(),
  visited: new Set(),
  revealed: new Set(),
  seen: new Set(),
  counted: new Set(),
  counts: {},
  charts: {},
  act: 1,
  introIndex: 0,
  currentScene: null,
  selected: null
};
GAME.people.forEach(p => { state.counts[p] = 0; state.charts[p] = []; });

const $ = id => document.getElementById(id);
const curAct = () => state.act === 1 ? GAME.act1 : GAME.act2;
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const br  = t => esc(t).replace(/\n/g,"<br>");

function showScreen(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-"+name).classList.add("active");
  window.scrollTo(0,0);
}
/* 이미지 배경 위에 어두운 막을 한 겹 씌운다 (가독성 + 분위기) */
function bgValue(bg, dim){
  if(bg.includes("gradient(")) return bg;
  const veil = dim === "card"
    ? "linear-gradient(rgba(8,12,20,.45),rgba(8,12,20,.78))"
    : "linear-gradient(rgba(8,12,20,.28),rgba(8,12,20,.58))";
  return veil + ', url("'+bg+'")';
}

/* ── 타이틀 · 인트로 ── */
function initTitle(){
  $("t-title").textContent = GAME.title;
  $("t-subtitle").textContent = GAME.subtitle;
  document.title = GAME.title;
  if(GAME.titleBackground){
    const t = $("screen-title");
    t.style.backgroundImage =
      'linear-gradient(rgba(8,12,20,.58),rgba(8,12,20,.85)), url("'+GAME.titleBackground+'")';
    document.querySelector("#screen-title .lamp").style.display = "none";
  }
}
function startIntro(){
  state.introIndex = 0; showScreen("intro");
  $("intro-line").textContent = GAME.intro[0] || "";
  if(!GAME.intro.length) enterHub();
}
function nextIntro(){
  state.introIndex++;
  if(state.introIndex >= GAME.intro.length){ enterHub(); return; }
  $("intro-line").textContent = GAME.intro[state.introIndex];
}

/* ── 허브 ── */
function enterHub(){
  closeNotebook();
  const act = curAct();
  $("hub-place").textContent = act.name;
  $("hub-incident").innerHTML = act.incident;
  const wrap = $("hub-cards"); wrap.innerHTML = "";
  act.scenes.forEach(sc=>{
    const card = document.createElement("div");
    card.className = "hub-card" + (state.visited.has(sc.id) ? " visited" : "");
    card.innerHTML = '<div class="bg" style="background-image:'+bgValue(sc.background,"card")+'"></div>'
                   + '<div class="name">'+sc.name+'</div>';
    card.onclick = ()=>enterScene(sc.id);
    wrap.appendChild(card);
  });
  const btn = $("hub-advance");
  btn.textContent = act.advance;
  btn.onclick = state.act === 1 ? goAct2 : openDeduce;
  showScreen("hub");
}
function goAct2(){ state.act = 2; state.visited.clear(); enterHub(); }

/* ── 장면 ── */
function enterScene(id){
  const sc = curAct().scenes.find(s=>s.id===id);
  if(!sc) return;
  state.currentScene = sc;
  state.visited.add(id);
  $("scene-name").textContent = sc.name;
  renderScene();
  closeTextbox();
  closeNotebook();
  showScreen("scene");
}
function visible(h){
  if(h.hidden && !state.revealed.has(h.id)) return false;
  const req = h.requires || (h.interview && h.interview.requires);
  if(req && !state.clues.has(req)) return false;
  if(h.reveals && h.reveals.every(r=>state.revealed.has(r))) return false;
  return true;
}
function renderScene(){
  const sc = state.currentScene, stage = $("stage");
  stage.style.backgroundImage = bgValue(sc.background);
  stage.querySelectorAll(".hotspot").forEach(h=>h.remove());
  sc.hotspots.filter(visible).forEach(h=>{
    const el = document.createElement("div");
    el.className = "hotspot"
      + (h.hidden ? " fresh" : "")
      + (state.seen.has(h.id) ? " done" : "");
    el.style.left = h.x+"%"; el.style.top = h.y+"%";
    el.style.width = h.w+"%"; el.style.height = h.h+"%";
    el.innerHTML = '<span class="dot"></span><span class="tag">'+esc(h.label||"")+'</span>';
    el.onclick = ()=>activateHotspot(h);
    stage.appendChild(el);
  });
}
function activateHotspot(h){
  state.seen.add(h.id);

  if(h.interview){ runInterview(h); renderScene(); return; }

  let text = h.text, g1 = h.givesClue, g2 = h.givesClue2;
  if(h.alt && state.clues.has(h.alt.clue)){
    text = h.alt.text;
    if(h.alt.givesClue !== undefined) g1 = h.alt.givesClue;
  }
  $("tb-speaker").textContent = h.speaker || h.label || "";
  $("tb-text").innerHTML = br(text);
  $("textbox").classList.add("open");
  if(g1) gainClue(g1);
  if(g2) gainClue(g2);
  if(h.chart) addChart(h.chart.who, h.chart.note);
  if(h.count && !state.counted.has(h.id)){
    state.counted.add(h.id);
    if(state.counts[h.count] !== undefined) state.counts[h.count]++;
  }
  if(h.reveals){ h.reveals.forEach(r=>state.revealed.add(r)); renderScene(); }
}

/* ── 질문하면 넷이 각각 대답한다 ── */
function runInterview(h){
  const iv = h.interview;
  $("tb-speaker").textContent = "내가 물었다";
  let html = '<div style="margin-bottom:14px;">'+br(iv.question)+'</div>';
  iv.answers.forEach(a=>{
    html += '<div class="ans"><span class="who">'+esc(a.who)+'</span>'+br(a.text)+'</div>';
    if(a.chart) addChart(a.who, a.chart);
    if(a.gives) gainClue(a.gives);
  });
  if(iv.gives) gainClue(iv.gives);
  $("tb-text").innerHTML = html;
  $("textbox").classList.add("open");
}

/* ── 기록 ── */
function gainClue(id){
  if(state.clues.has(id)) return;
  const clue = GAME.clues.find(c=>c.id===id);
  if(!clue){ console.warn("정의되지 않은 단서:", id); return; }
  state.clues.add(id);
  updateClueCount();
  showToast("인계장에 적었다 — " + clue.name);
}
function addChart(who, note){
  if(!state.charts[who]) return;
  if(state.charts[who].includes(note)) return;
  state.charts[who].push(note);
}
function updateClueCount(){
  document.querySelectorAll(".clue-count").forEach(el=>el.textContent = state.clues.size);
}
function toggleNotebook(){
  const nb = $("notebook");
  if(nb.classList.contains("open")){ closeNotebook(); return; }

  const list = $("notebook-list"); list.innerHTML = "";
  if(state.clues.size === 0){
    list.innerHTML = '<p class="clue-empty">아직 적은 게 없다.</p>';
  } else {
    GAME.clues.filter(c=>state.clues.has(c.id)).forEach(c=>{
      const d = document.createElement("div");
      d.className = "clue-item";
      d.innerHTML = '<div class="n">'+esc(c.name)+'</div><div class="d">'+esc(c.desc)+'</div>';
      list.appendChild(d);
    });
  }

  const anyCount = Object.values(state.counts).some(v=>v>0);
  const ch = $("notebook-charts"); ch.innerHTML = "";
  GAME.people.forEach(p=>{
    const n = state.counts[p], notes = state.charts[p];
    const zero = anyCount && n === 0;
    const d = document.createElement("div");
    d.className = "chart";
    d.innerHTML =
      '<div class="who">'+esc(p)+'<span class="cnt'+(zero?' zero':'')+'">'
        + (anyCount ? n+"회" : "—") + '</span></div>'
      + (notes.length
          ? '<ul>'+notes.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'
          : '<div class="none">기록 없음</div>');
    ch.appendChild(d);
  });

  nb.classList.add("open");
}
function closeNotebook(){ $("notebook").classList.remove("open"); }
function closeTextbox(){ $("textbox").classList.remove("open"); }

function showToast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ── 추리 ── */
function openDeduce(){
  closeNotebook();
  const d = GAME.deduction;
  $("deduce-lead").textContent = d.lead;
  $("deduce-clue-note").textContent = "인계장에 적힌 것 " + state.clues.size + "가지.";
  $("deduce-prompt").textContent = d.prompt;
  const wrap = $("deduce-options"); wrap.innerHTML = "";
  state.selected = null;
  d.options.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = ()=>{
      state.selected = o;
      wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
    };
    wrap.appendChild(b);
  });
  showScreen("deduce");
}
function submitDeduction(){
  if(!state.selected){ showToast("아직 고르지 않았다."); return; }
  const e = GAME.endings[GAME.deduction.routes[state.selected]];
  if(!e) return;
  $("end-title").textContent = e.title;
  $("end-text").textContent = e.text;
  showScreen("end");
}

/* ── 제작용 단축키 (H / E) ── */
let editMode = false, dragStart = null;
document.addEventListener("keydown", ev=>{
  const k = ev.key.toLowerCase();
  if(k === "h") document.body.classList.toggle("show-hotspots");
  if(k === "e"){
    editMode = !editMode;
    $("edit-panel").style.display = editMode ? "block" : "none";
    $("edit-rect").style.display = "none";
  }
});
$("stage").addEventListener("mousedown", ev=>{
  if(!editMode) return;
  const r = $("stage").getBoundingClientRect();
  dragStart = { x:(ev.clientX-r.left)/r.width*100, y:(ev.clientY-r.top)/r.height*100 };
});
$("stage").addEventListener("mousemove", ev=>{
  if(!editMode || !dragStart) return;
  const r = $("stage").getBoundingClientRect();
  const x2 = (ev.clientX-r.left)/r.width*100, y2 = (ev.clientY-r.top)/r.height*100;
  const x = Math.min(dragStart.x,x2), y = Math.min(dragStart.y,y2);
  const w = Math.abs(x2-dragStart.x), h = Math.abs(y2-dragStart.y);
  const rect = $("edit-rect");
  rect.style.display = "block";
  rect.style.left = x+"%"; rect.style.top = y+"%";
  rect.style.width = w+"%"; rect.style.height = h+"%";
  $("edit-out").textContent =
    "{ x: "+x.toFixed(0)+", y: "+y.toFixed(0)+", w: "+w.toFixed(0)+", h: "+h.toFixed(0)+" }";
});
document.addEventListener("mouseup", ()=>{ dragStart = null; });

initTitle();
</script>
</body>
</html>
